<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanto Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Kanto Region Pokémon Map</h1>
    <div id="map"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Map initialization
        function initMap() {
            const kantoCoords = { lat: 35.6852, lng: 139.7528 }; // Example coordinates
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 8,
                center: kantoCoords,
            });

            // Pokémon markers
            const pokemonLocations = [
                { coords: {lat: 38.4560, lng: 138.3955}, name: 'Pikachu'},
                { coords: {lat: 35.6895, lng: 139.6917}, name: 'Bulbasaur'},
                // Add more Pokémon with coordinates here
            ];

            pokemonLocations.forEach(pokemon => {
                const marker = new google.maps.Marker({
                    position: pokemon.coords,
                    map: map,
                    title: pokemon.name
                });
            });
        }
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
</body>
</html>
